name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Получение кода
        uses: actions/checkout@v6

      - name: Установка .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Восстановление зависимостей
        run: dotnet restore ISTU_TEST_LR1.sln

      - name: Запуск тестов
        run: dotnet test ISTU_TEST_LR1.sln --configuration Release --no-restore